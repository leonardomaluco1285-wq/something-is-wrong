
name: Build Something Is Wrong

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar arquivos
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort | head -200

      - name: Compilar mod
        run: gradle build

      - name: Mostrar arquivos gerados
        if: always()
        run: |
          find . -type f -name "*.jar" -print

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: something-is-wrong-jar
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
